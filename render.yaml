services:
  - type: web
    name: rawad-clinic-assistant
    runtime: python
    # Closest Render region to Libya (EU).
    region: frankfurt
    # NOTE: free instances sleep after ~15 min of inactivity. A Messenger webhook
    # should stay always-on, so consider "starter" for production.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    # Render pings this path to confirm the service is healthy.
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # --- Non-secret configuration (safe to commit) ---
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-flash-latest
      # --- Secrets: set the real values in the Render Dashboard (never committed) ---
      - key: GEMINI_API_KEY
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
